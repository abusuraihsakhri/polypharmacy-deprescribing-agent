name: Polypharmacy Deprescribing Engine CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      AUDIT_SECRET_KEY: "test-only-ci-audit-signing-key-not-for-production"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[api,test]'

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Check Python syntax
      run: python -m compileall -q agents polypharmacy_deprescribing_agent cli.py deprescribe_mind.py enrichment.py

    - name: Security HMAC & identifier regression
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        from agents.base import AuditTrail, SecurityException, PHIGuard
        trail = AuditTrail(secret_key='test-only-hmac-check')
        trail.log('tester', 'ci', 'EVENT', {'synthetic': True})
        assert trail.verify_integrity()
        trail.logs[0]['event_type'] = 'TAMPERED'
        assert not trail.verify_integrity()
        try:
            PHIGuard.assert_no_phi('MRN:123456')
        except SecurityException:
            pass
        else:
            raise AssertionError('Identifier check did not block sample')
        print('Security regression checks passed')
        "
