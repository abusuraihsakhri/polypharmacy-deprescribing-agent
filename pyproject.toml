[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polypharmacy-deprescribing-engine"
version = "2.0.0"
description = "DeprescribeMind: Beers 2023 Criteria & STOPP/START Geriatric Medication Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
polypharmacy-deprescribing-engine = "polypharmacy_deprescribing_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/polypharmacy-deprescribing-engine"
Repository = "https://github.com/abusuraihsakhri/polypharmacy-deprescribing-engine.git"
